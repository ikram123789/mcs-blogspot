{% extends 'base.html' %}

{% block content %}

<div class="row">
      <!-- Left sidebar -->
        {% include 'dashboard/sidebar.html' %}
      <!-- right side content -->
         <div class="col-md-9">
            <span>Logged in as <b>{{ user }}</b></span>
            <div class="row">
                <div class="col">
                    <div class="card boder-default mb-3">
                        <div class="card-header text-center text-uppercase font-weight-bold">All Categories</div>
                        <div class="card-body text-dark">
                            <div class="card-title text-center">{{ category_count }}</div>
                        </div>
                    </div>
                </div>

                <div class="col">
                    <div class="card boder-default mb-3">
                        <div class="card-header text-center text-uppercase font-weight-bold">All posts</div>
                        <div class="card-body text-dark">
                            <div class="card-title text-center">{{ blogs_count }}</div>
                        </div>
                    </div>
                </div>
            </div> 
         </div>
</div>

{% endblock %}
