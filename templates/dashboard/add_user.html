{% extends 'base.html' %}

{% block content %}
{% load crispy_forms_tags %}

<div class="row">
    <!-- sidebar -->
    {% include 'dashboard/sidebar.html' %}

    <!-- right side -->
    <div class="col-md-9">
        {% if perms.auth.view_user %}
        <h3>Add New User</h3>

        <form action="{% url 'add_user' %}" method="POST">
            {% csrf_token %}
            {{ form | crispy }}
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
        {% else %}
        <h4>You dont have the permissions to view this page!</h4>
        {% endif %}
    </div>
</div>

{% endblock %}
