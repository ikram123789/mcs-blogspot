{% extends 'base.html' %}

{% block content %}
{% load crispy_forms_tags %}

<div class="row">
    <!-- sidebar -->
    {% include 'dashboard/sidebar.html' %}

    <!-- right side -->
    <div class="col-md-9">
        <h3>Edit Blog Post</h3>

        <form action="{% url 'edit_post' post.id %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form | crispy }}
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
</div>

{% endblock %}
